<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GORILLA 解答・スクリプト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material 3 の考え方：枠線や影ではなく面の濃淡で区切る。色は元の青を種にした濃淡 */
:root{
  --accent:#2357c9; --accent-light:#dae2ff; --on-accent-light:#0b2a6b;
  --ink:#1a1c22; --sub:#454852;
  --warn-bg:#fdf1d3; --warn-edge:#e0a800; --on-warn:#5c4300;
  --ok-bg:#dcf3e4; --ok-edge:#2e8b57; --on-ok:#0d4a2b;
  --bg:#f2f3fb; --card:#ffffff; --line:#dcdde6;
  --surface-low:#f4f5fb; --surface:#eceef6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",sans-serif;
  font-weight:400;
  line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:8px 16px 16px}
/* 上部ナビ（公開サイト版のみ。共有ノートのトップへ戻る） */
nav.topnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:4px;height:64px;
  padding:0 max(4px,calc((100% - 860px)/2 + 4px));background:var(--bg);font-size:.95em}
nav.topnav a.back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 12px;border-radius:99px;
  color:var(--accent);text-decoration:none;font-weight:500;flex-shrink:0}
nav.topnav a.back:hover{background:rgba(35,87,201,.08)}
nav.topnav a.back svg{width:20px;height:20px;fill:currentColor}
nav.topnav .sep{color:var(--sub);opacity:.5}
nav.topnav .here{padding-left:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.page{background:var(--accent-light);color:var(--on-accent-light);border-radius:28px;padding:32px 32px 28px;margin:8px 0 12px}
header.page h1{margin:0;font-size:1.9em;font-weight:400;line-height:1.35}
header.page .meta{margin:8px 0 0;font-size:.9em;opacity:.8}
.ref-note{background:var(--surface);padding:10px 16px;border-radius:12px;font-size:.9em;color:var(--sub);margin:0 0 12px}
nav.toc{background:var(--card);border-radius:28px;padding:24px 32px;margin-bottom:12px}
nav.toc h2{margin:0 0 8px;font-size:.85em;font-weight:500;letter-spacing:.06em;color:var(--sub)}
nav.toc ol{margin:0;padding-left:1.6em}
nav.toc li{padding:2px 0}
nav.toc li::marker{color:var(--sub)}
nav.toc a{color:var(--ink);text-decoration:none}
nav.toc a.sub{color:var(--sub);font-size:.9em}
nav.toc a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
section.chapter{background:var(--card);border-radius:28px;padding:32px;margin-bottom:12px;scroll-margin-top:72px}
section.chapter h2{margin:0 0 20px;font-size:1.55em;font-weight:400;line-height:1.4}
section.chapter h3{margin:28px 0 10px;font-size:1.02em;font-weight:500;color:var(--accent);scroll-margin-top:72px}
section.chapter h2+h3{margin-top:0}
section.chapter h4{margin:22px 0 8px;font-size:.95em;font-weight:700}
.src{margin:0 0 8px;font-size:.85em;color:var(--sub)}
/* 解答の表：設問番号・問題・答え */
.tbl{border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.ans{width:100%;border-collapse:collapse;font-size:.95em;line-height:1.6}
table.ans th{background:var(--surface);text-align:left;font-weight:500;font-size:.85em;color:var(--sub);padding:8px 14px}
table.ans td{border-top:1px solid var(--line);padding:9px 14px;vertical-align:top}
table.ans td.n{width:3em;color:var(--sub)}
table.ans td.a{width:38%;font-weight:700;color:var(--accent)}
table.ans .ann{font-weight:400;font-size:.9em}
/* スクリプト */
.script h4{color:var(--accent)}
.script p{margin:0 0 4px}
/* ホバー解説：点線の下線。PCはカーソルを合わせると、スマホはタップで表示 */
.gloss{text-decoration:underline dotted rgba(35,87,201,.7);text-decoration-thickness:1.5px;text-underline-offset:3px;
  cursor:help;border-radius:3px;-webkit-tap-highlight-color:transparent}
.gloss.on{background:var(--accent-light)}
.gloss:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gloss-tip{position:absolute;z-index:200;max-width:320px;padding:8px 12px;border-radius:8px;background:#2f3036;color:#f2f0f4;
  font-size:.85rem;font-weight:400;line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.gloss-tip.show{opacity:1;visibility:visible}
/* 翻訳モード：右下のボタン（「AIに聞く」と同じ M3 の拡張FAB。スクロール中は縮む）→ 英文をタップすると下に訳 */
.tr-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:900;display:inline-flex;align-items:center;
  height:56px;padding:0 20px 0 16px;border:none;border-radius:16px;background:var(--accent-light);color:var(--on-accent-light);
  font:500 15px/1 "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;letter-spacing:.02em;white-space:nowrap;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.1);-webkit-tap-highlight-color:transparent;transition:padding .2s}
.tr-fab[hidden]{display:none}
.tr-fab .tr-ico{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--on-accent-light);color:var(--accent-light);
  font-size:14px;font-weight:700;line-height:1}
.tr-fab .tr-lbl{display:inline-block;max-width:8em;margin-left:10px;overflow:hidden;transition:max-width .2s,margin .2s}
.tr-fab.mini{padding:0 16px}
.tr-fab.mini .tr-lbl{max-width:0;margin-left:0}
.tr-fab:hover{box-shadow:inset 0 0 0 100vmax rgba(11,42,107,.08),0 4px 10px rgba(0,0,0,.18)}
.tr-fab:focus-visible,.tr-bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tr-mode .tr-fab{display:none}
@media (min-width:900px){.tr-fab{right:24px;bottom:24px}}
.tr-bar{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:950;display:none;align-items:center;gap:4px;
  width:calc(100% - 32px);max-width:640px;min-height:64px;margin:0 auto;padding:8px 8px 8px 20px;border-radius:16px;background:#2f3036;color:#f1f0f7;
  font:15px/1.5 "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.tr-mode .tr-bar{display:flex}
.tr-bar-t{flex:1;min-width:0}
.tr-bar-t b{font-weight:500}
.tr-bar-t small{display:block;font-size:12px;opacity:.75}
.tr-bar button{width:48px;height:48px;flex-shrink:0;border:none;border-radius:50%;background:none;color:#f1f0f7;font-size:20px;cursor:pointer}
.tr-bar button:hover{background:rgba(255,255,255,.1)}
body.tr-mode{padding-bottom:96px}
.tr-mode .sent{border-radius:4px;background:rgba(35,87,201,.06);box-shadow:0 0 0 1px rgba(35,87,201,.18);cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;-webkit-tap-highlight-color:transparent}
.tr-mode .sent:hover{background:rgba(35,87,201,.12)}
.tr-mode .sent.open{background:var(--accent-light);box-shadow:0 0 0 1.5px var(--accent)}
.ja{display:block;margin:6px 0 10px;padding:8px 14px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
  background:var(--surface-low);color:var(--ink);font-size:.93em;line-height:1.75}
@media print{.tr-fab,.tr-bar{display:none!important}}
/* 公開サイト版のパスワード入力（本文は暗号化してあり、正しいパスワードで復号して表示する） */
.lock{background:var(--card);border-radius:28px;padding:32px;margin-bottom:12px;text-align:center}
.lock h2{margin:0 0 4px;font-size:1.3em;font-weight:400}
.lock p{margin:0 0 20px;font-size:.875em;color:var(--sub)}
.lock form{max-width:320px;margin:0 auto}
.lock input{display:block;width:100%;height:56px;padding:0 16px;border:1px solid #757782;border-radius:12px;font:inherit;background:#fff;color:inherit;outline:none}
.lock input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lock button{display:block;width:100%;height:48px;margin-top:16px;border:none;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:wait}
.lock .err{min-height:1.4em;margin:12px 0 0;color:#ba1a1a;font-size:.85em}
.forget{text-align:center;margin:0 0 12px}
.forget button{height:40px;padding:0 20px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--sub);font:inherit;font-size:.85em;cursor:pointer}
.forget button:hover{background:var(--surface)}
footer.page{color:var(--sub);font-size:.8em;text-align:center;padding:24px 0 40px}
@media (max-width:640px){
  header.page{padding:24px 20px;border-radius:24px}
  header.page h1{font-size:1.5em}
  nav.toc,section.chapter{padding:24px 20px;border-radius:24px}
  table.ans{font-size:.9em}
  table.ans th,table.ans td{padding:8px 8px}
  table.ans td.n{width:2.2em}
  table.ans td.a{width:40%}
}
@media print{
  body{background:#fff;font-size:12px;line-height:1.6}
  section.chapter{border:none;padding:0 0 16px;break-inside:avoid-page}
  header.page{border-radius:0}
  nav.toc{border:none}
  nav.topnav,.gloss-tip{display:none}
}
</style>
</head>

<script>
// 本文は暗号化してある。正しいパスワードから作った鍵で復号して表示し、鍵は localStorage に保存する
(function() {
  var STORE = 'gorilla_key';
  var data = JSON.parse(document.getElementById('gData').textContent);
  var lock = document.getElementById('gLock'), content = document.getElementById('gContent');
  var forget = document.getElementById('gForget');
  function bytes(s) { return Uint8Array.from(atob(s), function(c) { return c.charCodeAt(0); }); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function load() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function clear() { try { localStorage.removeItem(STORE); } catch (e) {} }

  function derive(pass) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits'])
      .then(function(base) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(data.salt), iterations: data.iter, hash: 'SHA-256' }, base, 256);
      });
  }
  function decrypt(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.ct)); })
      .then(function(pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) {
    lock.hidden = true;
    content.innerHTML = html;
    forget.hidden = false;
    var target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (target) target.scrollIntoView();
    document.dispatchEvent(new Event('gorilla:content'));   // 翻訳モードのボタンを出す
  }

  var stored = load();
  if (stored) {
    decrypt(bytes(stored)).then(show, function() { clear(); lock.hidden = false; });
  } else {
    lock.hidden = false;
  }

  document.getElementById('gForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('gBtn'), err = document.getElementById('gErr');
    var input = document.getElementById('gPass');
    btn.disabled = true;
    err.textContent = '';
    var raw;
    derive(input.value)
      .then(function(r) { raw = r; return decrypt(r); })
      .then(function(html) { save(b64(raw)); show(html); },
            function() { err.textContent = 'パスワードが違います'; input.value = ''; input.focus(); })
      .then(function() { btn.disabled = false; });
  });

  forget.querySelector('button').addEventListener('click', function() {
    clear();
    location.reload();
  });
})();
</script>

<script>
// ホバー解説：.gloss の data-tip を吹き出しで出す。マウスはホバー、タッチはタップで表示・非表示
(function() {
  var tip = document.createElement('div');
  tip.className = 'gloss-tip';
  tip.setAttribute('role', 'tooltip');
  document.body.appendChild(tip);
  var cur = null;
  var canHover = window.matchMedia('(hover: hover)').matches;

  function place(el) {
    var r = el.getBoundingClientRect();
    tip.style.maxWidth = Math.min(320, window.innerWidth - 24) + 'px';
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 12));
    var y = r.top - h - 8;
    if (y < 72) y = r.bottom + 8;   // 上に出すと固定ナビに隠れるときは下に出す
    tip.style.left = (x + window.scrollX) + 'px';
    tip.style.top = (y + window.scrollY) + 'px';
  }
  function show(el) {
    if (cur) cur.classList.remove('on');
    cur = el;
    el.classList.add('on');
    tip.textContent = el.getAttribute('data-tip');
    place(el);
    tip.classList.add('show');
  }
  function hide() {
    if (cur) cur.classList.remove('on');
    cur = null;
    tip.classList.remove('show');
  }

  if (canHover) {
    document.addEventListener('mouseover', function(e) {
      var g = e.target.closest('.gloss');
      if (g && g !== cur) show(g);
    });
    document.addEventListener('mouseout', function(e) {
      var g = e.target.closest('.gloss');
      if (g && !g.contains(e.relatedTarget)) hide();
    });
  }
  document.addEventListener('click', function(e) {
    var g = e.target.closest('.gloss');
    if (!g) { hide(); return; }
    if (g === cur && !canHover) hide(); else show(g);
  });
  // キーボード操作（Tab）でも出す。タッチ端末ではタップ時のフォーカスで開閉が重ならないよう付けない
  if (canHover) {
    document.addEventListener('focusin', function(e) {
      if (e.target.classList && e.target.classList.contains('gloss')) show(e.target);
    });
    document.addEventListener('focusout', function(e) {
      if (e.target === cur) hide();
    });
  }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hide(); });
  window.addEventListener('resize', hide);
})();
</script>

  bar.setAttribute('aria-label', '翻訳モード');
  bar.innerHTML = '<div class="tr-bar-t"><b>翻訳モード</b><small>英文をタップすると下に訳が出ます（もう一度で閉じる）</small></div>' +
    '<button type="button" aria-label="翻訳モードをやめる">✕</button>';
  document.body.appendChild(fab);
  document.body.appendChild(bar);

  // 公開サイト版は本文がパスワード入力後に入るので、そのとき（gorilla:content）にもボタンの出し入れを見直す
  function refresh() { fab.hidden = !document.querySelector('.sent'); }
  refresh();
  document.addEventListener('gorilla:content', refresh);

  function closeAll() {
    document.querySelectorAll('.ja').forEach(function(el) { el.remove(); });
    document.querySelectorAll('.sent.open').forEach(function(el) { el.classList.remove('open'); });
  }
  fab.addEventListener('click', function() { document.body.classList.add('tr-mode'); });
  bar.querySelector('button').addEventListener('click', function() {
    document.body.classList.remove('tr-mode');
    closeAll();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.body.classList.contains('tr-mode')) bar.querySelector('button').click();
  });

  document.addEventListener('click', function(e) {
    if (!document.body.classList.contains('tr-mode')) return;
    if (e.target.closest('.gloss')) return;   // 点線の語はホバー解説を優先
    var s = e.target.closest('.sent');
    if (!s) return;
    var next = s.nextElementSibling;
    if (next && next.classList.contains('ja')) {
      next.remove();
      s.classList.remove('open');
    } else {
      var ja = document.createElement('span');
      ja.className = 'ja';
      ja.lang = 'ja';
      ja.textContent = s.getAttribute('data-ja');
      s.after(ja);
      s.classList.add('open');
    }
  });

  var timer = 0;
  window.addEventListener('scroll', function() {
    fab.classList.add('mini');
    clearTimeout(timer);
    timer = setTimeout(function() { fab.classList.remove('mini'); }, 400);
  }, { passive: true });
})();
</script>
</body>
</html>
