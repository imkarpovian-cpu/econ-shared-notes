<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>復習クイズ</title>
<script>
window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material 3 の考え方：枠線や影ではなく面の濃淡で区切る。色は元の青を種にした濃淡 */
:root{
  --accent:#2357c9; --accent-dark:#0b2a6b; --accent-light:#dae2ff;
  --tonal:#dfe2f3; --on-tonal:#171b2c;
  --ok:#2e7d4f; --ok-bg:#dcf3e4; --ng:#ba1a1a; --ng-bg:#ffdad6;
  --ink:#1a1c22; --sub:#454852; --bg:#f9f9ff; --card:#f2f3fb; --line:#c5c6d2;
  --surface-high:#e6e8f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",sans-serif;
  font-weight:400;
  line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:4px 16px 48px}
/* 上部ナビ（公開サイト版のみ。共有ノートのトップへ戻る） */
nav.topnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:4px;height:64px;
  padding:0 max(4px,calc((100% - 640px)/2 + 4px));background:var(--bg);font-size:.95em}
nav.topnav a.back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px 0 12px;border-radius:99px;
  color:var(--accent);text-decoration:none;font-weight:500;flex-shrink:0}
nav.topnav a.back:hover{background:rgba(35,87,201,.08)}
nav.topnav a.back svg{width:20px;height:20px;fill:currentColor}
nav.topnav .sep{color:var(--sub);opacity:.5}
nav.topnav .here{padding-left:8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border-radius:24px;padding:24px;margin:12px 0}
h1{font-size:1.5em;font-weight:400;line-height:1.4;margin:16px 4px 8px}
h2{font-size:1em;font-weight:500;margin:0 0 12px}
.sub{color:var(--sub);font-size:.875em}
/* ボタン：楕円・影なし。hover / 押下は色を薄く重ねて表す（M3 の state layer） */
button{font:inherit;font-size:.95em;font-weight:500;cursor:pointer;border:none;border-radius:99px;
  min-height:40px;padding:8px 24px;background:var(--tonal);color:var(--on-tonal);transition:box-shadow .15s}
button:hover:not(:disabled){box-shadow:inset 0 0 0 100vmax rgba(26,28,34,.08)}
button:active:not(:disabled){box-shadow:inset 0 0 0 100vmax rgba(26,28,34,.12)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{background:rgba(26,28,34,.08);color:rgba(26,28,34,.38);cursor:default}
.btn-primary,.btn-ok,.btn-ng{color:#fff}
.btn-primary{background:var(--accent)}
.btn-ok{background:var(--ok)}
.btn-ng{background:var(--ng)}
.btn-primary:hover:not(:disabled),.btn-ok:hover:not(:disabled),.btn-ng:hover:not(:disabled){box-shadow:inset 0 0 0 100vmax rgba(255,255,255,.1)}
.btn-primary:active:not(:disabled),.btn-ok:active:not(:disabled),.btn-ng:active:not(:disabled){box-shadow:inset 0 0 0 100vmax rgba(255,255,255,.16)}
.btn-big{display:block;width:100%;min-height:52px;font-size:1em;margin:8px 0}
.btn-ghost{background:transparent;color:var(--accent)}
.btn-small{min-height:32px;padding:2px 14px;font-size:.85em;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
/* 絞り込みはチップ（M3 の filter chip）。選んでいるものは色の付いた面になる */
label.chk{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px 4px 10px;margin:3px 2px;
  border:1px solid var(--line);border-radius:8px;font-size:.9em;cursor:pointer;transition:background .15s,border-color .15s}
label.chk:hover{background:rgba(26,28,34,.05)}
label.chk:has(input:checked){background:var(--tonal);border-color:var(--tonal);color:var(--on-tonal)}
label.chk input{accent-color:var(--accent);margin:0}
.tag{display:inline-block;font-size:.75em;font-weight:500;padding:2px 10px;border-radius:8px;background:var(--accent-light);color:var(--accent-dark);margin-right:8px}
.progress{height:4px;background:var(--accent-light);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress>div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:1.15em;margin:14px 0 18px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 18px;font-size:1em;font-weight:400;
  border-radius:16px;background:#fff;color:var(--ink);border:1px solid var(--line)}
.choice:disabled{background:#fff;color:var(--ink)}
.choice.correct{background:var(--ok-bg);border-color:var(--ok);font-weight:500}
.choice.wrong{background:var(--ng-bg);border-color:var(--ng)}
.answer-box{background:var(--accent-light);color:var(--accent-dark);border-radius:16px;padding:14px 18px;margin:12px 0}
.explain{background:var(--surface-high);border-radius:16px;padding:12px 16px;margin:10px 0;font-size:.95em}
.points{background:#fdf1d3;color:#3d2e00;border-radius:16px;padding:12px 16px;margin:10px 0;font-size:.95em}
.points ul{margin:4px 0 0;padding-left:1.3em}
textarea{width:100%;min-height:96px;font:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:4px 0}
.stat-grid .num{font-size:1.9em;font-weight:400;line-height:1.3;color:var(--accent)}
.stat-grid .lbl{font-size:.78em;color:var(--sub)}
.wrong-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:.94em}
.feedback{font-size:1.1em;font-weight:500;margin:12px 0}
.feedback.ok{color:var(--ok)} .feedback.ng{color:var(--ng)}
.center{text-align:center}
</style>
<script src="../../transition.js"></script>
</head>
<body>
<script src="../../auth.js"></script>
<nav class="topnav">
  <a class="back" href="../../index.html"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>共有ノート</a>
  <span class="sep">/</span>
  <span class="here">マクロ経済学 入門 クイズ</span>
</nav>
<div class="wrap"><div id="app"></div></div>
<script src="questions.js"></script>
<script>
(function(){
"use strict";
const app = document.getElementById('app');

if (!window.QUIZ_DATA || !Array.isArray(window.QUIZ_DATA.questions) || window.QUIZ_DATA.questions.length === 0) {
  app.innerHTML = '<div class="card"><h2>問題データが見つかりません</h2><p>このファイルと同じフォルダに <b>questions.js</b> を置いてください。</p></div>';
  return;
}

const D = window.QUIZ_DATA;
const KEY = 'testprep:' + D.id;
const TYPE_LABEL = { term: '一問一答', mc: '4択', essay: '記述' };

let stats = load();
let session = null; // {list, idx, results:[{q, ok}], reverse, order}

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(stats)); } catch(e){} }
function record(qid, ok){
  const s = stats[qid] || { o:0, x:0 };
  ok ? s.o++ : s.x++;
  s.last = ok ? 'o' : 'x';
  s.ts = Date.now();
  stats[qid] = s; save();
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function typeset(){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([app]).catch(function(){}); }
function chapters(){ const seen=[]; D.questions.forEach(q=>{ if(seen.indexOf(q.chapter)<0) seen.push(q.chapter); }); return seen; }
function isWeak(q){ const s = stats[q.id]; return !s || s.last === 'x'; }

/* ---------- ホーム画面 ---------- */
function home(){
  session = null;
  const total = D.questions.length;
  const answered = D.questions.filter(q=>stats[q.id]).length;
  const weak = D.questions.filter(isWeak).length;
  const chs = chapters();

  let html = '<h1>' + D.title + ' 復習クイズ</h1>';
  html += '<div class="card"><div class="stat-grid">'
    + '<div><div class="num">' + total + '</div><div class="lbl">全問題数</div></div>'
    + '<div><div class="num">' + answered + '</div><div class="lbl">挑戦済み</div></div>'
    + '<div><div class="num">' + weak + '</div><div class="lbl">要復習（弱点）</div></div>'
    + '</div></div>';

  html += '<div class="card"><h2>出題範囲</h2>'
    + '<div style="margin:-2px 0 8px"><button class="btn-small" id="b-check-all">全選択</button> '
    + '<button class="btn-small" id="b-check-none">全解除</button></div>'
    + '<div id="ch-filters">';
  chs.forEach((c,i)=>{ html += '<label class="chk"><input type="checkbox" class="f-ch" value="'+i+'" checked>'+c+'</label>'; });
  html += '</div><div style="margin-top:8px">';
  Object.keys(TYPE_LABEL).forEach(t=>{
    const n = D.questions.filter(q=>q.type===t).length;
    if (n>0) html += '<label class="chk"><input type="checkbox" class="f-type" value="'+t+'" checked>'+TYPE_LABEL[t]+'（'+n+'）</label>';
  });
  let savedOrder = 'random';
  try { savedOrder = localStorage.getItem(KEY + ':order') || 'random'; } catch(e){}
  html += '</div><div style="margin-top:8px">'
    + '<label class="chk"><input type="checkbox" id="f-rev">一問一答を逆方向（用語→定義）で出す</label>'
    + '</div><div style="margin-top:8px"><span class="sub" style="margin-right:2px">出題順:</span>'
    + '<label class="chk"><input type="radio" name="f-order" value="random"' + (savedOrder==='seq'?'':' checked') + '>ランダム</label>'
    + '<label class="chk"><input type="radio" name="f-order" value="seq"' + (savedOrder==='seq'?' checked':'') + '>問題順</label>'
    + '</div></div>';

  html += '<div class="card">'
    + '<button class="btn-primary btn-big" id="b-all">全問モード</button>'
    + '<button class="btn-big" id="b-weak" ' + (weak===0?'disabled':'') + '>弱点モード（間違い＋未回答 '+weak+'問）</button>'
    + '<div class="center" style="margin-top:10px"><button class="btn-ghost" id="b-reset">成績をリセット</button></div>'
    + '</div>';

  app.innerHTML = html;
  document.getElementById('b-all').onclick = ()=>start(false);
  document.getElementById('b-weak').onclick = ()=>start(true);
  document.getElementById('b-check-all').onclick = ()=>{ Array.from(document.querySelectorAll('.f-ch, .f-type')).forEach(function(el){ el.checked = true; }); };
  document.getElementById('b-check-none').onclick = ()=>{ Array.from(document.querySelectorAll('.f-ch, .f-type')).forEach(function(el){ el.checked = false; }); };
  document.getElementById('b-reset').onclick = ()=>{
    if (confirm('この科目の成績記録をすべて消しますか？')) { stats = {}; save(); home(); }
  };
  typeset();
}

function start(weakOnly){
  const chs = chapters();
  const selCh = Array.from(document.querySelectorAll('.f-ch:checked')).map(el=>chs[+el.value]);
  const selTy = Array.from(document.querySelectorAll('.f-type:checked')).map(el=>el.value);
  const reverse = document.getElementById('f-rev').checked;
  const orderEl = document.querySelector('input[name="f-order"]:checked');
  const order = orderEl ? orderEl.value : 'random';
  try { localStorage.setItem(KEY + ':order', order); } catch(e){}
  let list = D.questions.filter(q => selCh.indexOf(q.chapter)>=0 && selTy.indexOf(q.type)>=0);
  if (weakOnly) list = list.filter(isWeak);
  if (list.length === 0) { alert('条件に合う問題がありません。範囲・形式を確認してください。'); return; }
  session = { list: order==='seq' ? list.slice() : shuffle(list), idx: 0, results: [], reverse: reverse, order: order };
  renderQ();
}

/* ---------- 出題画面 ---------- */
function header(q){
  const cur = session.idx + 1, total = session.list.length;
  return '<div class="sub">'+cur+' / '+total+' 問</div>'
    + '<div class="progress"><div style="width:'+(session.idx/total*100)+'%"></div></div>'
    + '<div><span class="tag">'+TYPE_LABEL[q.type]+'</span><span class="sub">'+q.chapter+'</span></div>';
}
function renderQ(){
  if (session.idx >= session.list.length) return results();
  const q = session.list[session.idx];
  if (q.type === 'term') renderTerm(q);
  else if (q.type === 'mc') renderMC(q);
  else renderEssay(q);
}
function next(ok, q){
  record(q.id, ok);
  session.results.push({ q: q, ok: ok });
  session.idx++;
  renderQ();
}
function quitBtn(){ return '<div class="center" style="margin-top:14px"><button class="btn-ghost" id="b-quit">中断してホームへ</button></div>'; }
function bindQuit(){ document.getElementById('b-quit').onclick = ()=>{ if(confirm('中断しますか？（ここまでの正誤は記録済みです）')) home(); }; }

function renderTerm(q){
  const front = session.reverse ? q.back : q.front;
  const back  = session.reverse ? q.front : q.back;
  app.innerHTML = '<div class="card">' + header(q)
    + '<div class="qtext">' + front + '</div>'
    + '<div id="zone"><button class="btn-primary btn-big" id="b-show">答えを見る</button></div>'
    + quitBtn() + '</div>';
  document.getElementById('b-show').onclick = ()=>{
    document.getElementById('zone').innerHTML =
      '<div class="answer-box"><b>答え:</b> ' + back + '</div>'
      + '<div class="row"><button class="btn-ok btn-big" id="b-ok">◯ 答えられた</button>'
      + '<button class="btn-ng btn-big" id="b-ng">✗ まだ</button></div>';
    document.getElementById('b-ok').onclick = ()=>next(true, q);
    document.getElementById('b-ng').onclick = ()=>next(false, q);
    typeset();
  };
  bindQuit(); typeset();
}

function renderMC(q){
  const order = shuffle(q.choices.map((c,i)=>({ text:c, correct: i===q.answer })));
  let html = '<div class="card">' + header(q) + '<div class="qtext">' + q.question + '</div><div id="zone">';
  order.forEach((c,i)=>{ html += '<button class="choice" data-i="'+i+'">' + c.text + '</button>'; });
  html += '</div><div id="after"></div>' + quitBtn() + '</div>';
  app.innerHTML = html;
  Array.from(document.querySelectorAll('.choice')).forEach(btn=>{
    btn.onclick = ()=>{
      const ok = order[+btn.dataset.i].correct;
      Array.from(document.querySelectorAll('.choice')).forEach((b,j)=>{
        b.disabled = true;
        if (order[j].correct) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });
      let after = '<div class="feedback ' + (ok?'ok':'ng') + '">' + (ok?'◯ 正解！':'✗ 不正解') + '</div>';
      if (q.explanation) after += '<div class="explain"><b>解説:</b> ' + q.explanation + '</div>';
      after += '<button class="btn-primary btn-big" id="b-next">次へ</button>';
      document.getElementById('after').innerHTML = after;
      document.getElementById('b-next').onclick = ()=>next(ok, q);
      typeset();
    };
  });
  bindQuit(); typeset();
}

function renderEssay(q){
  app.innerHTML = '<div class="card">' + header(q)
    + '<div class="qtext">' + q.question + '</div>'
    + '<textarea id="memo" placeholder="ここに自分の答えをメモ（任意・採点には使いません）"></textarea>'
    + '<div id="zone" style="margin-top:10px"><button class="btn-primary btn-big" id="b-show">模範解答を見る</button></div>'
    + quitBtn() + '</div>';
  document.getElementById('b-show').onclick = ()=>{
    let html = '<div class="answer-box"><b>模範解答</b><br>' + q.modelAnswer + '</div>';
    if (q.points && q.points.length) {
      html += '<div class="points"><b>採点ポイント（自己チェック）</b><ul>';
      q.points.forEach(p=>{ html += '<li>' + p + '</li>'; });
      html += '</ul></div>';
    }
    html += '<div class="row"><button class="btn-ok btn-big" id="b-ok">◯ 書けた</button>'
      + '<button class="btn-ng btn-big" id="b-ng">✗ まだ</button></div>';
    document.getElementById('zone').innerHTML = html;
    document.getElementById('b-ok').onclick = ()=>next(true, q);
    document.getElementById('b-ng').onclick = ()=>next(false, q);
    typeset();
  };
  bindQuit(); typeset();
}

/* ---------- 結果画面 ---------- */
function results(){
  const total = session.results.length;
  const ok = session.results.filter(r=>r.ok).length;
  const wrongs = session.results.filter(r=>!r.ok);
  const rate = total ? Math.round(ok/total*100) : 0;

  let html = '<h1>結果</h1><div class="card"><div class="stat-grid">'
    + '<div><div class="num">' + total + '</div><div class="lbl">出題数</div></div>'
    + '<div><div class="num">' + ok + '</div><div class="lbl">正解</div></div>'
    + '<div><div class="num">' + rate + '%</div><div class="lbl">正答率</div></div>'
    + '</div></div>';

  if (wrongs.length) {
    html += '<div class="card"><h2>間違えた問題（' + wrongs.length + '）</h2>';
    wrongs.forEach(r=>{
      const q = r.q;
      const label = q.type==='term' ? (session.reverse?q.back:q.front) : q.question;
      html += '<div class="wrong-item"><span class="tag">'+TYPE_LABEL[q.type]+'</span>' + label + '</div>';
    });
    html += '<button class="btn-primary btn-big" id="b-retry" style="margin-top:12px">間違いだけやり直す</button></div>';
  } else {
    html += '<div class="card center"><b>全問正解！</b></div>';
  }
  html += '<div class="card"><button class="btn-big" id="b-home">ホームへ戻る</button></div>';

  app.innerHTML = html;
  if (wrongs.length) document.getElementById('b-retry').onclick = ()=>{
    const qs = wrongs.map(r=>r.q);
    session = { list: session.order==='seq' ? qs : shuffle(qs), idx: 0, results: [], reverse: session.reverse, order: session.order };
    renderQ();
  };
  document.getElementById('b-home').onclick = home;
  typeset();
}

home();
})();
</script>
</body>
</html>
